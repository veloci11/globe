<svg width="1920" height="1080" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0c29;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#302b63;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#24243e;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="glow1">
      <stop offset="0%" style="stop-color:#ff6b35;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#ff6b35;stop-opacity:0" />
    </radialGradient>
    <radialGradient id="glow2">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#00d4ff;stop-opacity:0" />
    </radialGradient>
  </defs>
  
  <!-- Fond principal -->
  <rect width="1920" height="1080" fill="url(#bgGrad)"/>
  
  <!-- Glows atmosphériques -->
  <ellipse cx="300" cy="200" rx="400" ry="300" fill="url(#glow1)"/>
  <ellipse cx="1600" cy="800" rx="500" ry="400" fill="url(#glow2)"/>
  
  <!-- Étoiles -->
  <circle cx="200" cy="150" r="2" fill="white" opacity="0.8"/>
  <circle cx="400" cy="300" r="1.5" fill="white" opacity="0.6"/>
  <circle cx="800" cy="200" r="2" fill="white" opacity="0.9"/>
  <circle cx="1200" cy="400" r="1" fill="white" opacity="0.5"/>
  <circle cx="1500" cy="250" r="2" fill="white" opacity="0.7"/>
  <circle cx="1700" cy="600" r="1.5" fill="white" opacity="0.6"/>
  <circle cx="300" cy="700" r="1" fill="white" opacity="0.8"/>
  <circle cx="600" cy="900" r="2" fill="white" opacity="0.7"/>
  <circle cx="1100" cy="800" r="1.5" fill="white" opacity="0.9"/>
  <circle cx="1400" cy="950" r="1" fill="white" opacity="0.6"/>
</svg>
