<svg width="1920" height="1080" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="shapeGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6b35;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#f7931e;stop-opacity:0.05" />
    </linearGradient>
    <linearGradient id="shapeGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:0.12" />
      <stop offset="100%" style="stop-color:#0099ff;stop-opacity:0.06" />
    </linearGradient>
    <filter id="blur">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" />
    </filter>
  </defs>
  
  <!-- Formes géométriques abstraites -->
  <circle cx="400" cy="300" r="200" fill="url(#shapeGrad1)" filter="url(#blur)"/>
  <circle cx="1500" cy="700" r="250" fill="url(#shapeGrad2)" filter="url(#blur)"/>
  
  <!-- Polygones décoratifs -->
  <polygon points="200,800 350,700 500,850 350,950" fill="white" opacity="0.08" filter="url(#blur)"/>
  <polygon points="1200,200 1400,150 1450,350 1250,400" fill="white" opacity="0.06" filter="url(#blur)"/>
  
  <!-- Rectangles arrondis -->
  <rect x="800" y="100" width="300" height="150" rx="20" fill="url(#shapeGrad1)" opacity="0.1" filter="url(#blur)"/>
  <rect x="1100" y="800" width="400" height="200" rx="30" fill="url(#shapeGrad2)" opacity="0.08" filter="url(#blur)"/>
</svg>
